# 2 GB is enough for this module and leaves room on a student laptop that is
# also running the emulator, SQL Server and the API.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# AndroidX, and Kotlin code style for the IDE.
android.useAndroidX=true
kotlin.code.style=official

# Only the resources this module actually declares end up in R, which keeps the
# class small and the build fast.
android.nonTransitiveRClass=true
